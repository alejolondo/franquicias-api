server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: franquicias-api
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017}
    database: ${MONGO_DATABASE:franquicias}
  data:
    mongodb:
      auto-index-creation: true
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    "[com.franquicias.api]": ${LOG_LEVEL:INFO}