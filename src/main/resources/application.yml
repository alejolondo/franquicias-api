server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: franquicias-api
  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    database: ${MONGO_DATABASE:franquicias}
    uri: ${MONGO_URI:mongodb://localhost:27017}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.franquicias.api: ${LOG_LEVEL:INFO}