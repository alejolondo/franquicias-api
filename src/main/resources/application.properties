server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: franquicias-api
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017}
      database: ${MONGO_DATABASE:franquicias}
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.franquicias.api: ${LOG_LEVEL:INFO}